[project]
name = "pygira"
version = "0.0.1"
description = "Provisioning CLI for Gira G1 and X1 devices"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Philipp Dreimann", email = "philipp@dreimann.net" }]
keywords = ["gira", "knx", "g1", "x1", "provisioning", "home-automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
]
requires-python = ">=3.10"
dependencies = [
    "tomli>=2; python_version < '3.11'",
    "websockets>=14",
    "click>=8",
    "rich>=13",
    "lxml>=5",
    "pydantic>=2",
]

[project.urls]
Homepage = "https://github.com/dphi/pygira"
Repository = "https://github.com/dphi/pygira"
Issues = "https://github.com/dphi/pygira/issues"

[project.scripts]
pygira = "pygira.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pygira"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = [
    "--cov=pygira",
    "--cov-report=term-missing",
    "--cov-report=xml",
]

[dependency-groups]
dev = [
    "diff-cover>=9.2",
    "lxml-stubs>=0.5",
    "mypy>=1.0",
    "pre-commit>=4.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0",
    "ruff>=0.9",
]

[tool.coverage.run]
branch = true
source = ["pygira"]

[tool.coverage.report]
fail_under = 51
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
fixable = ["ALL"]
select = [
    # pydocstyle
    "D",
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pycodestyle warnings
    "W",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # Refactor
    "R",
    # Tidy Imports
    "TID",
    # Annotations
    "ANN",
    # Complexity
    "C",
    # Try/Except
    "TRY",
    # type checking
    "TC",
    # Performance
    "PERF",
    # Pathlib
    "PL",
    # Pluralization
    "PLR",
    # Path
    "PTH",
    # Comma
    "COM",
    # Error Handling
    "EM",
]


[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"

# Forbid lazy imports by default, while allowing specific exceptions.
ban-lazy = { include = "all", exclude = ["typing"] }

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = "tomli"
ignore_missing_imports = true